property:
  headline: "Espíritu andaluz entre bosques y sierras"
  paragraphs:
    - "Sobre una fracción de 10 hectáreas se encuentra un casco de estilo andaluz, restaurado a nuevo en 2021, con 400 m² edificados y amplios ambientes. La distribución integra sala comedor con estufa a leña, cocina semi integrada y una espaciosa sala de estar y juegos."
    - "La propiedad está rodeada de bosques, sierras y un jardín añoso, con las playas del este uruguayo y los servicios de Piriápolis próximos. Cuenta además con casa de caseros, garaje, galpón e instalaciones para el manejo de ganado."

