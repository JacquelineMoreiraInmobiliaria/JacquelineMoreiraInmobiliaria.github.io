property:
  sectionTitle: "La propiedad"
  headline: "Chacra del Sol,  Dos casas en Piriápolis"
  paragraphs:
    - "Chacra del Sol se encuentra en una pradera elevada de 5.5 hectáreas en Piriápolis, a unas 20 cuadras de Playa Hermosa y Playa Grande. La propiedad ofrece vistas al mar y los cerros, con acceso por camino de ripio y una ubicación a aproximadamente 5 minutos de la rambla de Playa Hermosa. Cuenta con dos viviendas de diseño, integradas al entorno mediante grandes aberturas que permiten aprovechar las vistas y la luz natural. La casa principal tiene 250 m² edificados en dos plantas. En planta baja dispone de amplio living comedor con estufa a leña, cocina, dos dormitorios y dos baños, uno de ellos en suite. En planta alta se encuentran otros dos dormitorios amplios y un baño completo."
    - "La segunda vivienda, de 110 m² y construida mediante técnicas de bioconstrucción, cuenta con living comedor, cocina, tres dormitorios y dos baños. En el exterior se destacan una piscina climatizada con sistema de salinización, barbacoa techada, monte nativo, monte de eucaliptos y dos tajamares. La chacra también dispone de dos caballerizas, gallinero, galpón de 12 m², alambrados en perfecto estado y pozo de agua de 60 metros de profundidad con un rendimiento informado de 1.200 litros por hora. Una propiedad que combina viviendas amplias, instalaciones complementarias y un entorno natural próximo a la costa de Piriápolis."
