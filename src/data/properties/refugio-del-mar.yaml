property:
  headline: "Entre valle y bosque, cerca del mar"
  paragraphs:
    - "Sobre 5 hectáreas de valle y bosque, Refugio del Mar combina privacidad, naturaleza y cercanía a la playa en Piriápolis. La propiedad cuenta con un gran chalet de sólida construcción, amplios dormitorios, varios baños y generosos ambientes para compartir."
    - "El área social integra living, salas de estar, bar y barbacoa con un amplio deck de madera y piscina. El parque suma un lago artificial enjardinado, área de juegos y mini cancha de fútbol, además de una casa independiente para caseros."

