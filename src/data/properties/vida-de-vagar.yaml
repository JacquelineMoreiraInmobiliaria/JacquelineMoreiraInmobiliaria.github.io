property:
  headline: "Entre el arroyo, las sierras y el mar"
  paragraphs:
    - "Vida de Vagar reúne 7 hectáreas de valle en Playa Verde, a 2 km de Playa Lamas, con vistas al mar y las sierras. El campo incluye potreros, monte indígena y 200 metros de costa sobre el arroyo Tarariras."
    - "La propiedad cuenta con dos casas independientes, cercadas y con accesos individuales. La casa principal ofrece living con estufa a leña, cocina integrada, dos dormitorios, baño y patio techado; la segunda suma amplios ambientes, sector de bar, cocina completa, dormitorio, dos baños y parrillero techado."

