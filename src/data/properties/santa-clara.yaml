property:
  headline: "Chacra elevada con piscina climatizada y vista al mar."
  paragraphs:
    - "Santa Clara es una chacra alta y despejada ubicada detrás de los balnearios Playa Hermosa y Playa Verde. Integra campo y playa, con vistas al mar, al parque y al Cerro Pan de Azúcar."
    - "La construcción principal tiene 270 m² distribuidos en 2 plantas y fue realizada con paredes dobles de ladrillo, losa de hormigón, aberturas dobles de aluminio —triples en las orientadas al sur— y pisos de porcelanato. En planta baja dispone de living comedor, cocina definida con pasaplatos y mobiliario a medida, y 2 suites de iguales dimensiones. La calefacción combina calefactores de alto rendimiento a leña y un sistema central mediante bomba de agua caliente, presente también en todas las habitaciones."
    - "La suite principal ocupa la planta alta e incluye dormitorio con vista de 360 grados, balcón, toldo eléctrico en la ventana orientada al sur, baño completo, vestidor y oficina. La casa cuenta además con una barbacoa integrada con baño propio y calefactor a leña, conectada con otra barbacoa exterior techada y con la piscina climatizada."
    - "La propiedad se completa con una casa para caseros o huéspedes de 2 dormitorios y 1 baño, un galpón de 120 m² para maquinaria, tajamar y 2 pozos de agua destinados al uso doméstico y al riego. Cuenta con 500 metros de empalizada, canillas de agua cada 25 metros y una plantación de más de 150 eucaliptos y pinos."

