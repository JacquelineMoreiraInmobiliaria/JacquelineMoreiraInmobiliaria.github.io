property:
  sectionTitle: "La propiedad"
  headline: "Baguala: Chacra con dos casas y vista al mar"
  paragraphs:
    - "Baguala es una chacra de 1,6 hectáreas ubicada al norte de Balneario Las Flores, cerca del Castillo Pittamiglio, a 10 cuadras de la playa y a pocos minutos de Piriápolis. Su terreno elevado ofrece vistas al mar y a los cerros, en un entorno de jardines, monte nativo con coronillas y otras especies autóctonas. La propiedad cuenta con dos viviendas con accesos independientes desde la calle. La casa principal, desarrollada en una planta, dispone de un amplio living comedor con salida a un deck con pérgola, cocina semiintegrada con muebles bajo mesada y aéreos, dos dormitorios, el principal con vestidor y baño en suite, otro baño completo y un espacio que puede utilizarse como oficina o tercer dormitorio. También incorpora una sala de microcine con proyector Biosonic, pantalla de 150 pulgadas y sistema de sonido Home Theater, además de un proyector instalado en el living. Su construcción incluye paredes de ticholo, techo Isopanel con cielorrasos de yeso y aislación, pisos flotantes, aberturas de aluminio con doble vidrio hermético, losa radiante y agua caliente alimentadas a gas. El acceso principal dispone de portera automatizada y portero eléctrico con cámara y control a distancia."
    - "En el exterior se encuentra una amplia barbacoa con cocina, baño completo, deck y sector de comedor bajo techo de quincho. La piscina abierta de 8 x 4 metros y el jacuzzi independiente, climatizado a gas, cuentan con cloradores de sal. La propiedad también dispone de cochera, depósito, canil, invernáculo, huerta y árboles frutales. La segunda vivienda, denominada La Choza, tiene acceso propio desde la calle y ofrece living comedor con cocina integrada, dos dormitorios y baño completo, con construcción mayoritariamente tradicional, techo Isopanel y pisos cerámicos. El predio está completamente cercado con alambrado de siete hilos y malla electrosoldada, y gran parte cuenta con riego automatizado abastecido por un pozo semisurgente de 48 metros de profundidad. Ambas casas disponen de conexión a OSE, UTE con cableado subterráneo y fibra óptica, y se venden con amoblamiento básico. La ubicación se encuentra a aproximadamente 40 km de Punta del Este y 80 km de Montevideo. Se contempla la posibilidad de permuta, con condiciones a consultar."
