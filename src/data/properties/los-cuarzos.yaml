property:
  headline: "Horizonte serrano entre cuarzos y atardeceres"
  paragraphs:
    - "En lo alto de la propiedad, la casa principal se integra al suelo rocoso y ofrece amplios ambientes con vistas a las sierras y al atardecer. El living comedor incorpora cocina con barra, mientras que el subsuelo suma una sala de juegos y un dormitorio de visitas."
    - "La terraza perimetral se conecta con una amplia barbacoa techada y una piscina con solárium. El conjunto incluye dos casas para personal, invernáculo, huerta, árboles frutales, granero, galpón de herramientas y acceso a una cañada con pequeña laguna."

