property:
  headline: "Dos viviendas modernas entre sierras."
  paragraphs:
    - "En el lugar existen dos construcciones modernas. La casa principal está sobre pilares para aprovechar las vistas panorámicas, con techo liviano, grandes aberturas de aluminio y luz natural durante todo el día."
    - "La segunda vivienda, también sobre pilares y de construcción liviana, cuenta con amplias aberturas de aluminio, losa radiante, ambiente integrado de living y cocina, 1 dormitorio, 1 baño completo y un amplio deck de madera orientado hacia la panorámica del lugar."
    - "El entorno de las viviendas presenta parque con frutales y árboles ornamentales, monte nativo de sierras, Montes de pinos y eucaliptos aportan sombra, privacidad y funcionan como cortinas durante la temporada de vientos."

